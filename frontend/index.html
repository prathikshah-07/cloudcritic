<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CloudCritic</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: system-ui, sans-serif; padding: 2rem; }
  h1 { font-size: 1.8rem; margin-bottom: .25rem; color: #58a6ff; }
  p.sub { color: #8b949e; margin-bottom: 1.5rem; font-size: .9rem; }
  textarea {
    width: 100%; height: 160px; background: #161b22; color: #e6edf3;
    border: 1px solid #30363d; border-radius: 6px; padding: .75rem;
    font-size: .9rem; resize: vertical; outline: none;
  }
  textarea:focus { border-color: #58a6ff; }
  .btn-row { display: flex; gap: .75rem; margin: 1rem 0; }
  button {
    padding: .55rem 1.25rem; border-radius: 6px; border: none;
    font-size: .9rem; cursor: pointer; font-weight: 600;
  }
  #scoreBtn   { background: #238636; color: #fff; }
  #explainBtn { background: #1f6feb; color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #error { color: #f85149; margin: .5rem 0; font-size: .85rem; min-height: 1.2rem; }
  #aggregate { display: none; margin: 1.5rem 0 1rem; }
  .agg-label { font-size: .85rem; color: #8b949e; text-transform: uppercase; letter-spacing: .05em; }
  .agg-score { font-size: 4rem; font-weight: 700; line-height: 1; color: #58a6ff; }
  #pillars {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: .75rem; margin-bottom: 1.5rem;
  }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; }
  .card-name  { font-size: .78rem; color: #8b949e; margin-bottom: .4rem; text-transform: uppercase; letter-spacing: .04em; }
  .card-score { font-size: 2rem; font-weight: 700; color: #e6edf3; }
  .card-detail{ font-size: .78rem; color: #8b949e; margin-top: .25rem; }
  #findingsSection h2,
  #explainSection h2 { font-size: 1.1rem; margin-bottom: .75rem; color: #e6edf3; }
  .finding {
    background: #161b22; border: 1px solid #30363d; border-radius: 6px;
    padding: .75rem 1rem; margin-bottom: .5rem;
    display: flex; align-items: flex-start; gap: .75rem;
  }
  .badge {
    font-size: .7rem; font-weight: 700; padding: .2rem .5rem;
    border-radius: 4px; white-space: nowrap; flex-shrink: 0; margin-top: .15rem;
  }
  .CRITICAL { background: #da3633; color: #fff; }
  .HIGH     { background: #d4782a; color: #fff; }
  .MEDIUM   { background: #9e6a03; color: #fff; }
  .LOW      { background: #3d444d; color: #e6edf3; }
  .finding-body { flex: 1; }
  .finding-meta { font-size: .75rem; color: #8b949e; margin-bottom: .2rem; }
  .finding-desc { font-size: .85rem; color: #e6edf3; }
  #explainSection { margin-top: 1.5rem; display: none; }
  #explainBox {
    background: #161b22; border: 1px solid #30363d; border-radius: 6px;
    padding: 1rem; font-size: .9rem; line-height: 1.6; color: #c9d1d9; white-space: pre-wrap;
  }
</style>
</head>
<body>

<h1>☁️ CloudCritic</h1>
<p class="sub">Paste an AWS architecture description and score it against the Well-Architected Framework.</p>

<textarea id="arch" placeholder="e.g. We run a multi-az RDS instance with automated backups. Traffic flows through CloudFront and an ALB load balancer. IAM roles control access. Encryption at rest via KMS..."></textarea>

<div class="btn-row">
  <button id="scoreBtn">Score my architecture</button>
  <button id="explainBtn" disabled>Explain in plain English</button>
</div>
<div id="error"></div>

<div id="aggregate">
  <div class="agg-label">Aggregate score</div>
  <div class="agg-score" id="aggNum">—</div>
</div>

<div id="pillars"></div>

<div id="findingsSection" style="display:none">
  <h2>Findings</h2>
  <div id="findingsList"></div>
</div>

<div id="explainSection">
  <h2>Plain-English Explanation</h2>
  <div id="explainBox"></div>
</div>

<script>
  const archEl     = document.getElementById('arch');
  const scoreBtn   = document.getElementById('scoreBtn');
  const explainBtn = document.getElementById('explainBtn');
  const errorEl    = document.getElementById('error');
  const aggSection = document.getElementById('aggregate');
  const aggNum     = document.getElementById('aggNum');
  const pillarsEl  = document.getElementById('pillars');
  const findSec    = document.getElementById('findingsSection');
  const findList   = document.getElementById('findingsList');
  const expSec     = document.getElementById('explainSection');
  const expBox     = document.getElementById('explainBox');

  function setError(msg) { errorEl.textContent = msg; }
  function clearError()  { errorEl.textContent = ''; }

  function scoreColor(s) {
    if (s >= 80) return '#3fb950';
    if (s >= 60) return '#d29922';
    return '#f85149';
  }

  function normalizePillars(data) {
    // Handle both score_architecture shape {pillars:{name:{score,passing,total}}}
    // and EvaluationReport shape {pillar_scores:{name:{score,passing_rules,total_rules}}}
    if (data.pillars) return data.pillars;
    return Object.fromEntries(
      Object.entries(data.pillar_scores).map(([k, v]) => [
        k, { score: v.score, passing: v.passing_rules, total: v.total_rules }
      ])
    );
  }

  function renderPillars(pillars) {
    pillarsEl.innerHTML = '';
    for (const [name, d] of Object.entries(pillars)) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        `<div class="card-name">${name}</div>` +
        `<div class="card-score" style="color:${scoreColor(d.score)}">${d.score}</div>` +
        `<div class="card-detail">${d.passing} / ${d.total} rules passed</div>`;
      pillarsEl.appendChild(card);
    }
  }

  function renderFindings(findings) {
    findList.innerHTML = '';
    if (!findings.length) {
      findList.innerHTML = '<p style="color:#3fb950;font-size:.9rem">✓ No findings — all rules passed.</p>';
      return;
    }
    for (const f of findings) {
      const el = document.createElement('div');
      el.className = 'finding';
      el.innerHTML =
        `<span class="badge ${f.severity}">${f.severity}</span>` +
        `<div class="finding-body">` +
          `<div class="finding-meta">${f.pillar} · ${f.rule_id}</div>` +
          `<div class="finding-desc">${f.description}</div>` +
        `</div>`;
      findList.appendChild(el);
    }
  }

  scoreBtn.addEventListener('click', async () => {
    const text = archEl.value.trim();
    if (!text) { setError('Please paste an architecture description first.'); return; }
    clearError();
    scoreBtn.disabled = true;
    scoreBtn.textContent = 'Scoring…';
    expSec.style.display = 'none';
    explainBtn.disabled = true;

    try {
      const res = await fetch('/api/score', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ architecture: text }),
      });
      if (!res.ok) { const e = await res.json(); throw new Error(e.detail || res.statusText); }
      const data = await res.json();

      const agg = data.aggregate_score ?? data.aggregate ?? 0;
      aggNum.textContent = agg;
      aggNum.style.color = scoreColor(agg);
      aggSection.style.display = 'block';

      renderPillars(normalizePillars(data));

      findSec.style.display = 'block';
      renderFindings(data.findings ?? []);

      explainBtn.disabled = false;
    } catch (err) {
      setError('Error: ' + err.message);
    } finally {
      scoreBtn.disabled = false;
      scoreBtn.textContent = 'Score my architecture';
    }
  });

  explainBtn.addEventListener('click', async () => {
    const text = archEl.value.trim();
    if (!text) return;
    clearError();
    explainBtn.disabled = true;
    explainBtn.textContent = 'Explaining…';

    try {
      const res = await fetch('/api/explain', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ architecture: text }),
      });
      if (!res.ok) { const e = await res.json(); throw new Error(e.detail || res.statusText); }
      const data = await res.json();
      expBox.textContent = data.explanation;
      expSec.style.display = 'block';
    } catch (err) {
      setError('Error: ' + err.message);
    } finally {
      explainBtn.disabled = false;
      explainBtn.textContent = 'Explain in plain English';
    }
  });
</script>
</body>
</html>
